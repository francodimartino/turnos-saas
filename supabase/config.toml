# Configuración de Supabase local (CLI + Docker). Solo para desarrollo y CI:
# no contiene credenciales; las claves locales las genera la propia CLI.
project_id = "turnos-saas"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000"]
jwt_expiry = 3600
enable_signup = false

# Auth Hook (ARCHITECTURE.md §3.4): inyecta tenant_id / is_owner / is_platform_admin en el JWT.
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"
