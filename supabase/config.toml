# Configuración de Supabase local (CLI + Docker). Solo para desarrollo y CI:
# no contiene credenciales; las claves locales las genera la propia CLI.
project_id = "turnos-saas"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000"]
jwt_expiry = 3600
enable_signup = false
# Política de contraseñas (la de Auth hosteado se configura en el panel del proveedor; ver ARCHITECTURE.md).
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits_symbols"
# Rotación de refresh tokens: cada uso emite uno nuevo; el anterior tolera reuso solo 10 s (carreras de red).
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

# Auth Hook (ARCHITECTURE.md §3.4): inyecta tenant_id / is_owner / is_platform_admin en el JWT.
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"

# MFA TOTP habilitado (alta y verificación).
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# Mail de invitación: lleva a /invitacion?token_hash=... del dashboard (ruta relativa a la raíz del workdir de la CLI).
[auth.email.template.invite]
subject = "Te invitaron a Turnos"
content_path = "./supabase/templates/invite.html"
