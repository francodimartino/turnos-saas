[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "turnos-saas"
version = "0.0.0"
description = "Gestión de turnos para estéticas y peluquerías (SaaS multi-tenant)"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "asyncpg",
    "sentry-sdk[fastapi]",
    "httpx",
    "PyJWT[crypto]",
    "tzdata",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "pyyaml",
]

# platform/ se incluye como paquetes locales (ARCHITECTURE.md §4.1), sin dependencia externa.
[tool.setuptools.packages.find]
where = [
    "platform/packages/platform_tenancy",
    "platform/packages/platform_auth",
    "platform/packages/platform_secrets",
    "platform/packages/platform_admin",
    "platform/packages/platform_audit",
    "platform/packages/platform_notifications",
    "platform/packages/platform_calendar",
    "apps/shared",
    "apps/bot",
    "apps/dashboard-backend",
    "apps/admin-backend",
    "apps/jobs",
]

[tool.pytest.ini_options]
testpaths = ["platform", "apps", "tests"]
# Raíces de paquete importables sin pip install -e (Python local < 3.11). Mantener en sync con
# [tool.setuptools.packages.find].where: un paquete nuevo se agrega en las dos listas.
pythonpath = [
    "platform/packages/platform_tenancy",
    "platform/packages/platform_auth",
    "platform/packages/platform_secrets",
    "platform/packages/platform_admin",
    "platform/packages/platform_audit",
    "platform/packages/platform_notifications",
    "platform/packages/platform_calendar",
    "apps/shared",
    "apps/bot",
    "apps/dashboard-backend",
    "apps/admin-backend",
    "apps/jobs",
]
asyncio_mode = "auto"
markers = [
    "integracion: necesita Supabase local levantado (supabase start)",
]

[tool.ruff]
target-version = "py311"
line-length = 120
# Raíz explícita para que las carpetas con su propio ruff.toml (imports prohibidos) clasifiquen los imports igual.
src = ["."]
extend-exclude = ["supabase", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "SIM", "RET", "PTH", "TID251"]
# TID251 (imports prohibidos): la lista de cada carpeta vive en su propio ruff.toml (hereda este archivo con `extend`).
# Raíz: sin lista, los tests de integración cruzada (tests/), scripts/ y tools/ pueden importar cualquier app.

[tool.ruff.lint.per-file-ignores]
# Tests: assert es la forma de afirmar en pytest (S101); las contraseñas/tokens literales son datos de prueba
# inventados (S105/S106); el SQL de los tests de integración arma identificadores propios, nunca entrada ajena (S608).
"**/tests/**" = ["S101", "S105", "S106", "S608"]
"tests/**" = ["S101", "S105", "S106", "S608"]
"conftest.py" = ["S101", "S105", "S106"]
# Los tests y scripts lanzan subprocesos con lista de argumentos fija (sin shell, sin entrada externa): S603.
"scripts/**" = ["S603"]
# S608 (SQL armado con f-strings) en código de producción: falso positivo justificado en un solo lugar. Todos estos
# módulos interpolan únicamente constantes de módulo (listas de columnas, intervalos) o nombres de columna/operadores
# fijos por el código llamador (`armar_set` valida cada nombre contra una regexp); todo valor de usuario viaja siempre
# como parámetro posicional ($1, $2…) de asyncpg.
"apps/bot/turnos_bot/identidad/repositorio.py" = ["S608"]
"apps/bot/turnos_bot/sesiones.py" = ["S608"]
"apps/dashboard-backend/dashboard_backend/clientes.py" = ["S608"]
"apps/dashboard-backend/dashboard_backend/catalogo_asignaciones.py" = ["S608"]
"apps/dashboard-backend/dashboard_backend/catalogo_profesionales.py" = ["S608"]
"apps/dashboard-backend/dashboard_backend/catalogo_servicios.py" = ["S608"]
"apps/dashboard-backend/dashboard_backend/disponibilidad.py" = ["S608"]
"apps/dashboard-backend/dashboard_backend/turnos.py" = ["S608"]
"platform/packages/platform_admin/platform_admin/auditoria.py" = ["S608"]
"tests/test_escaner_secretos.py" = ["S603"]

[tool.mypy]
# Modo básico (sin strict): se chequean los cuerpos tipados y se resuelven los paquetes locales con las
# mismas rutas que pytest (mantener en sync con [tool.pytest.ini_options].pythonpath).
python_version = "3.12"
# Solo las carpetas del proyecto con código Python versionado: `mypy` sin argumentos no recorre carpetas no
# versionadas de la raíz (como un entorno virtual local). Una carpeta nueva con .py se agrega acá.
files = ["apps", "platform", "scripts", "tests", "tools", "conftest.py"]
mypy_path = [
    "platform/packages/platform_tenancy",
    "platform/packages/platform_auth",
    "platform/packages/platform_secrets",
    "platform/packages/platform_admin",
    "platform/packages/platform_audit",
    "platform/packages/platform_notifications",
    "platform/packages/platform_calendar",
    "apps/shared",
    "apps/bot",
    "apps/dashboard-backend",
    "apps/admin-backend",
    "apps/jobs",
]
explicit_package_bases = true
namespace_packages = true
exclude = ["supabase/", "node_modules/", "apps/[^/]+/(node_modules|dist)/"]
# Los cuerpos de funciones sin anotar no se chequean (modo básico): la nota que avisa de eso es ruido.
disable_error_code = ["annotation-unchecked"]
ignore_missing_imports = false

# asyncpg no publica tipos (ni py.typed): sus objetos (Connection, Pool, Record) son Any para mypy.
[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

# PyYAML no trae tipos y types-PyYAML no se agrega solo para esto (scripts/verificar_arranque.py y tests).
# git_aislado: helper de tests/ que pytest resuelve por rootdir (sin paquete); mypy no lo ve.
[[tool.mypy.overrides]]
module = ["yaml", "tzdata", "tzdata.*", "git_aislado"]
ignore_missing_imports = true

# Tests: los dobles de prueba (fakes de asyncpg/httpx/Supabase, dicts de Config armados con **kwargs, módulos de
# scripts cargados con importlib) no se tipan de forma estricta y mypy los reporta como ruido. Se silencian SOLO estos
# códigos y SOLO en tests; el código de producción no tiene override. Los asyncpg con `Any` (Connection, Pool, Record)
# ya quedan cubiertos por el override de asyncpg de arriba.
[[tool.mypy.overrides]]
module = ["tests", "tests.*", "*.tests", "*.tests.*"]
disable_error_code = [
    "arg-type",
    "attr-defined",
    "has-type",
    "list-item",
    "misc",
    "name-defined",
    "override",
    "return-value",
    "union-attr",
    "var-annotated",
]
