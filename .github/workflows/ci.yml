name: CI

# Solo en PRs (y a mano): el CI de la PR corre sobre el resultado de mergear
# con main, y los merges a main no despliegan nada todavía; repetir la suite
# completa en main duplicaba el costo de cada PR. Para una corrida completa
# sobre cualquier rama: Actions > CI > Run workflow.
on:
  pull_request:
  workflow_dispatch:

# Permisos mínimos del GITHUB_TOKEN: ningún job escribe en el repo; si alguno
# necesitara más, se amplía solo en ese job y se justifica ahí.
permissions:
  contents: read

# Un push nuevo a la misma PR cancela la corrida anterior.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Decide qué jobs pesados aplican según los archivos que cambió la PR.
  # Los jobs filtrados siguen existiendo siempre (el filtro va acá y no en el
  # trigger del workflow) para que sus checks aparezcan en success/skipped
  # y nunca queden pendientes.
  cambios:
    name: Detectar cambios
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontends: ${{ steps.detectar.outputs.frontends }}
      db: ${{ steps.detectar.outputs.db }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Detectar archivos cambiados
        id: detectar
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Corrida manual: se corre todo."
            echo "frontends=true" >> "$GITHUB_OUTPUT"
            echo "db=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ARCHIVOS="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          echo "Archivos cambiados:"; echo "$ARCHIVOS"
          WORKFLOW='^\.github/(workflows/ci\.yml|scripts/supabase-start\.sh)$'
          if echo "$ARCHIVOS" | grep -Eq "^apps/[^/]+-frontend/|^platform/admin-frontend-template/|^contratos/|^apps/(dashboard|admin)-backend/|(^|/)package(-lock)?\.json$|$WORKFLOW"; then
            echo "frontends=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontends=false" >> "$GITHUB_OUTPUT"
          fi
          # Base de datos y Python: todo apps/ salvo los frontends, platform/ salvo el template de frontend.
          if echo "$ARCHIVOS" | grep -Ev '^apps/[^/]+-frontend/|^platform/admin-frontend-template/' \
              | grep -Eq "^supabase/|^platform/|^apps/|^tests/|^conftest\.py$|^pyproject\.toml$|^scripts/verificar\.py$|$WORKFLOW"; then
            echo "db=true" >> "$GITHUB_OUTPUT"
          else
            echo "db=false" >> "$GITHUB_OUTPUT"
          fi

  secretos:
    name: Escaneo de secretos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Escanear diff
        if: github.event_name == 'pull_request'
        run: bash .github/scripts/escanear-secretos.sh "origin/${{ github.base_ref }}...HEAD"

  python:
    name: Tests Python (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Instalar dependencias
        run: |
          pip install -r requirements-dev.lock
          pip install --no-deps -e .
      - name: Lint (ruff)
        run: ruff check .
      - name: Formato (ruff format)
        run: ruff format --check .
      - name: Tipos (mypy)
        run: mypy
      - name: Correr pytest
        run: |
          # Código 5 = todavía no hay tests; no es un fallo.
          # Los tests `integracion` se saltan solos sin DATABASE_URL.
          pytest || [ $? -eq 5 ]
      - name: Contratos al día (OpenAPI y permisos)
        run: |
          python scripts/contrato_openapi.py --verificar || {
            echo "::error::Contrato OpenAPI desactualizado. Regeneralo con 'python scripts/contrato_openapi.py', luego los tipos con 'npm run api:generar' en cada frontend, y commitea los tres."
            exit 1
          }
          python scripts/contrato_permisos.py --verificar || {
            echo "::error::contratos/permisos.json desactualizado. Regeneralo con 'python scripts/contrato_permisos.py' y commitealo."
            exit 1
          }

  integracion:
    name: Tests de integración Python (Supabase local)
    needs: cambios
    if: needs.cambios.outputs.db == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Instalar dependencias
        run: |
          pip install -r requirements-dev.lock
          pip install --no-deps -e .
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: 2.119.0
      - name: Levantar Supabase local (aplica supabase/migrations)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: bash .github/scripts/supabase-start.sh
      - name: Correr pytest -m integracion
        env:
          # Superusuario de la base local efímera del runner (no es un secret).
          # Las contraseñas de los roles de login las genera el fixture al azar en cada corrida.
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: pytest -m integracion -v
      - name: Instalar como en Render (pip install . en un virtualenv limpio)
        run: |
          python -m venv "$RUNNER_TEMP/venv-render"
          "$RUNNER_TEMP/venv-render/bin/pip" install -r requirements.lock
          "$RUNNER_TEMP/venv-render/bin/pip" install --no-deps .
          # Desde otro directorio, para no importar el código del repo: solo lo que instaló pip.
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv-render/bin/python" -c "
          import importlib, pathlib
          modulos = ['turnos_bot.main', 'dashboard_backend.main', 'admin_backend.main', 'jobs_purga.__main__',
                     'jobs_vencimiento.__main__', 'jobs_comun', 'turnos_observabilidad', 'uvicorn']
          modulos += sorted(d.name for d in pathlib.Path('$GITHUB_WORKSPACE/platform/packages').iterdir()
                            if d.name.startswith('platform_'))
          for m in modulos:
              importlib.import_module(m)
              print('importa:', m)
          "
      - name: Arranque de cada servicio de render.yaml contra Supabase local
        run: python scripts/verificar_arranque.py --python "$RUNNER_TEMP/venv-render/bin/python"

  frontends:
    name: Lint y typecheck (frontends)
    needs: cambios
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        app: [dashboard-frontend, admin-frontend]
    # El filtro va en los pasos y no en el job: un job de matriz salteado
    # aparece con el nombre sin expandir y los checks "(app)" no existirían.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: needs.cambios.outputs.frontends == 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: needs.cambios.outputs.frontends == 'true'
        with:
          node-version: "20"
      - name: Lint, typecheck y tests
        if: needs.cambios.outputs.frontends == 'true'
        working-directory: apps/${{ matrix.app }}
        run: |
          if [ ! -f package.json ]; then echo "Sin package.json todavía."; exit 0; fi
          npm ci
          npm run lint --if-present
          npm run typecheck --if-present
          npm test --if-present
          npm run api:verificar --if-present || {
            echo "::error::Los tipos de la API no coinciden con el contrato. Regenerá el contrato ('python scripts/contrato_openapi.py') y los tipos ('npm run api:generar' en ${{ matrix.app }}), y commitea los tres."
            exit 1
          }
      - name: Sin cambios en frontends
        if: needs.cambios.outputs.frontends != 'true'
        run: echo "La PR no toca frontends; no aplica."

  aislamiento-rls:
    name: Tests pgTAP de aislamiento (Supabase local)
    needs: cambios
    if: needs.cambios.outputs.db == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verificar si hay tests pgTAP
        id: hay
        run: |
          # La CLI de Supabase solo monta supabase/ en el contenedor de pg_prove:
          # los tests de platform/infra se copian a supabase/tests (copias ignoradas por git).
          for f in platform/infra/pgtap-tests/*.sql; do
            [ -e "$f" ] && cp "$f" "supabase/tests/platform_$(basename "$f")"
          done
          if ls supabase/tests/*.sql >/dev/null 2>&1 && [ -f supabase/config.toml ]; then
            echo "tests=si" >> "$GITHUB_OUTPUT"
          else
            echo "Todavía no hay tests pgTAP ni config de Supabase."
            echo "tests=no" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: 2.119.0
        if: steps.hay.outputs.tests == 'si'
      - name: Levantar Supabase local
        if: steps.hay.outputs.tests == 'si'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: bash .github/scripts/supabase-start.sh
      - name: Correr pgTAP
        if: steps.hay.outputs.tests == 'si'
        run: supabase test db
