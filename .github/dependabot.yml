# Actualizaciones automáticas de dependencias (CVEs y versiones).
# Cada ecosistema agrupa las actualizaciones minor y patch en una sola PR;
# las major llegan como PRs separadas, para revisarlas una a una.
# pip: Dependabot lee pyproject.toml pero NO mantiene los lockfiles con hashes
# (requirements.lock y requirements-dev.lock, generados con `uv pip compile`):
# una PR de pip se acepta solo regenerando ambos locks en la misma PR, con el
# procedimiento de "Lock de dependencias" en docs/deploy.md.
# npm: la plantilla platform/admin-frontend-template no tiene entrada propia: es copia de apps/admin-frontend y
# se regenera con `python scripts/sincronizar_admin_frontend.py` tras aceptar una PR de esa carpeta.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    groups:
      pip-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: npm
    directory: "/apps/dashboard-frontend"
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: npm
    directory: "/apps/admin-frontend"
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
