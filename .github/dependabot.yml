# Actualizaciones automáticas de dependencias (CVEs y versiones).
# pip: Dependabot lee pyproject.toml; los lockfiles con hashes
# (requirements.lock y requirements-dev.lock) se regeneran a mano al
# aceptar un cambio, con el procedimiento documentado en docs/deploy.md.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: "/apps/dashboard-frontend"
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: "/apps/admin-frontend"
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: "/platform/admin-frontend-template"
    schedule:
      interval: weekly
